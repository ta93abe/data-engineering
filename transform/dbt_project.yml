name: transform

profile: transform

seed-paths: ['seeds']
model-paths: ['models']
macro-paths: ['macros']
clean-targets:
  - 'target'
  - 'dbt_packages'

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  transform:
    +schema: raw

models:
  transform:
    # Materialize staging models as views, and marts as tables
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
